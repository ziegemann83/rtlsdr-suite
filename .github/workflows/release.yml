name: Build and release binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: RTLSDRSuite-windows.exe
            build_name: RTLSDRSuite
          - os: macos-latest
            artifact_name: RTLSDRSuite-macos
            build_name: RTLSDRSuite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio library (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile --windowed --name ${{ matrix.build_name }}
          --collect-all sounddevice
          --collect-all pyModeS
          --collect-all rtlsdr
          --collect-all pyqtgraph
          main.py

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item "dist/${{ matrix.build_name }}.exe" "dist/${{ matrix.artifact_name }}"
        shell: pwsh

      - name: Rename artifact (macOS)
        if: runner.os == 'macOS'
        run: cp "dist/${{ matrix.build_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RTLSDRSuite-windows.exe/RTLSDRSuite-windows.exe
            artifacts/RTLSDRSuite-macos/RTLSDRSuite-macos
          generate_release_notes: true
