name: Build and release binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: RTLSDRSuite-windows.exe
            build_name: RTLSDRSuite
          - os: macos-latest
            artifact_name: RTLSDRSuite-macos
            build_name: RTLSDRSuite
          - os: ubuntu-latest
            artifact_name: RTLSDRSuite-linux
            build_name: RTLSDRSuite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio library (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libxcb-cursor0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libgl1 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS .icns from PNG
        if: runner.os == 'macOS'
        run: |
          mkdir icon.iconset
          sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o assets/icon.icns

      - name: Build with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export QT_QPA_PLATFORM=offscreen
            ICON_FLAG=""  # PyInstaller does not support embedding icons in Linux ELF binaries
            ADD_DATA="assets:assets"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ICON_FLAG="--icon=assets/icon.ico"
            ADD_DATA="assets;assets"
          else
            ICON_FLAG="--icon=assets/icon.icns"
            ADD_DATA="assets:assets"
          fi
          pyinstaller --onefile --windowed --name ${{ matrix.build_name }} \
            $ICON_FLAG \
            --add-data "$ADD_DATA" \
            --collect-all sounddevice \
            --collect-all pyModeS \
            --collect-all rtlsdr \
            --collect-submodules pyqtgraph \
            --exclude-module pyqtgraph.examples \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            main.py

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item "dist/${{ matrix.build_name }}.exe" "dist/${{ matrix.artifact_name }}"
        shell: pwsh

      - name: Rename artifact (macOS)
        if: runner.os == 'macOS'
        run: cp "dist/${{ matrix.build_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: cp "dist/${{ matrix.build_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/RTLSDRSuite-windows.exe/RTLSDRSuite-windows.exe
            artifacts/RTLSDRSuite-macos/RTLSDRSuite-macos
            artifacts/RTLSDRSuite-linux/RTLSDRSuite-linux
          body: |
            Standalone builds of RTL-SDR Suite (spectrum/waterfall, FM/AM/SSB receiver, ADS-B tracker).
            Requires the RTL-SDR (librtlsdr) driver to be installed separately - see README.
            macOS binary is unsigned; right-click -> Open on first launch to bypass Gatekeeper.
            Linux binary: run `chmod +x RTLSDRSuite-linux` before launching.

            ---
            ## What's changed in this release
